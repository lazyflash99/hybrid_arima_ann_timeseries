name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests_check_everything_works -v
      - name: Run the quick pipeline
        run: python run_all.py --quick
      - name: Confirm the run log exists
        run: test -f results/run_log.json
